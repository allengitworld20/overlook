[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overlook"
version = "0.1.0"
description = "Open-source situational awareness tracker: ingests public event feeds, detects anomalies, clusters and links events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
overlook = "overlook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overlook = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
